name: Daily Brief
on:
  schedule:
    # 00:30 UTC = 06:00 IST. Scheduled starts can be delayed by GitHub.
    - cron: '30 0 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Prepare a brief without contacting delivery services or sending
        type: boolean
        default: true
      check_mailbox:
        description: Verify read-only newsletter intake and print safe counts
        type: boolean
        default: false
      hold_until_six:
        description: Prepare early and hold delivery until 06:00 IST
        type: boolean
        default: false
  pull_request:
    paths:
      - 'daily-brief/**'
      - '.github/workflows/daily-news.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: daily-brief
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: daily-brief/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
  news:
    needs: verify
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && vars.NEWS_BOT_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: nivesh-independent-news
      cancel-in-progress: false
    permissions:
      # Only delivery status/claims are written, to a dedicated state branch.
      contents: write
    defaults:
      run:
        working-directory: daily-brief
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: daily-brief/requirements.txt
      - run: pip install -r requirements.txt
      - name: Verify newsletter mailbox
        if: github.event_name == 'workflow_dispatch' && inputs.check_mailbox
        env:
          NEWSLETTER_IMAP_ENABLED: ${{ vars.NEWSLETTER_IMAP_ENABLED || 'false' }}
          NEWSLETTER_IMAP_USER: ${{ secrets.NEWSLETTER_IMAP_USER }}
          NEWSLETTER_IMAP_PASSWORD: ${{ secrets.NEWSLETTER_IMAP_PASSWORD }}
          NEWSLETTER_ALLOWED_SENDERS: ${{ secrets.NEWSLETTER_ALLOWED_SENDERS }}
        run: python scripts/setup_newsletters.py --check
      - name: Collect, summarise and deliver
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_KEY_PROJECTS: ${{ secrets.GEMINI_KEY_PROJECTS }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          NEWS_RESEARCH_ENABLED: ${{ vars.NEWS_RESEARCH_ENABLED || 'true' }}
          NEWS_BRIEF_MODE: ${{ vars.NEWS_BRIEF_MODE || 'short' }}
          NEWS_DETAIL_EMAIL_ENABLED: ${{ vars.NEWS_DETAIL_EMAIL_ENABLED || 'false' }}
          NEWS_DETAIL_EMAIL_TO: ${{ secrets.NEWS_DETAIL_EMAIL_TO }}
          NEWS_REPORT_SMTP_USER: ${{ secrets.NEWS_REPORT_SMTP_USER }}
          NEWS_REPORT_SMTP_PASSWORD: ${{ secrets.NEWS_REPORT_SMTP_PASSWORD }}
          NEWS_HOLD_UNTIL_6AM: ${{ github.event_name == 'workflow_dispatch' && inputs.hold_until_six }}
          AI_NEWSLETTER_ENABLED: ${{ vars.AI_NEWSLETTER_ENABLED || 'true' }}
          NEWSLETTER_IMAP_ENABLED: ${{ vars.NEWSLETTER_IMAP_ENABLED || 'false' }}
          NEWSLETTER_IMAP_USER: ${{ secrets.NEWSLETTER_IMAP_USER }}
          NEWSLETTER_IMAP_PASSWORD: ${{ secrets.NEWSLETTER_IMAP_PASSWORD }}
          NEWSLETTER_ALLOWED_SENDERS: ${{ secrets.NEWSLETTER_ALLOWED_SENDERS }}
          NEWS_DELIVERY: ${{ vars.NEWS_DELIVERY || 'telegram' }}
          NEWS_TELEGRAM_BOT_TOKEN: ${{ secrets.NEWS_TELEGRAM_BOT_TOKEN }}
          NEWS_TELEGRAM_CHAT_ID: ${{ secrets.NEWS_TELEGRAM_CHAT_ID }}
          NEWS_LEARNING_START_DATE: ${{ vars.NEWS_LEARNING_START_DATE || '2026-10-15' }}
          NEWS_FINANCE_START_DATE: ${{ vars.NEWS_FINANCE_START_DATE || vars.NEWS_LEARNING_START_DATE || '2026-10-15' }}
          NEWS_SMTP_USER: ${{ secrets.NEWS_SMTP_USER }}
          NEWS_SMTP_PASSWORD: ${{ secrets.NEWS_SMTP_PASSWORD }}
          NEWS_EMAIL_TO: ${{ secrets.NEWS_EMAIL_TO }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEWS_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$NEWS_DRY_RUN" = "true" ]; then
            python scripts/standalone_news.py --dry-run
          else
            python scripts/standalone_news.py
          fi
